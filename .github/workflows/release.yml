name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
      contents: write # commit the version bump
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Bump version to release tag
        run: |
          npm version "${TAG#v}" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${TAG#v}"
          git push
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        run: npm publish # prepack runs the build
