name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing
      contents: write # commit the version bump
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .github/mise.node24.toml # npm >= 11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org

      # Before anything installs, so a preview build is neither run nor published.
      # Overrides don't reach people installing the plugin, so these specs are
      # what they get.
      - name: Refuse dependencies from outside the registry
        run: |
          node -e '
            const { dependencies = {}, optionalDependencies = {} } = require("./package.json");
            const outside = Object.entries({ ...dependencies, ...optionalDependencies })
              .filter(([, spec]) => /[:/]/.test(spec));
            if (outside.length) {
              console.error("Not from the registry:", Object.fromEntries(outside));
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm install

      - name: Set version to release tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish to npm
        run: npm publish # prepack runs the build

      # Only after a successful publish, so a failed release never mutates the repo
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "Release ${TAG#v}" && git push; }
        env:
          TAG: ${{ github.event.release.tag_name }}
